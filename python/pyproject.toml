[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prism-py"
version = "0.1.0"
description = "Denoiser training and analysis tools for Prism"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/prism_py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
